name: Build and deploy documentation

on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    name: Build documentation and examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install native dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends
          doxygen gfortran liblapack-dev meson ninja-build
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation with warnings as errors
        run: python docs/build.py
      - name: Build runnable examples and their surface plugin
        run: |
          meson setup build
          meson compile -C build potlibc-ch52008 potlibc-energy potlibc-hvp
          meson test -C build --print-errorlogs "example *"
      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build/html

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
