<h3>
<b>Interface 7-1S</b></h3></center>
The interface 7-1S (7-body system, scalar mode) provides a set of calling
conventions for a subroutine that calculates single-point potential energy
of a 7-body system on a ground surface.  This interface follows the calling
conventions imposed by <a href="http://comp.chem.umn.edu/polyrate">POLYRATE</a>
